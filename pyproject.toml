[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnome-icon-pack-creator"
dynamic = ["version"]
description = "An app to build a GNOME icon pack from uploaded .svg files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Maciej Zych (Macina222)" }
]
keywords = ["gnome", "gtk4", "icons", "icon-theme", "linux", "freedesktop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: Gnome",
]
dependencies = [
    "PyGObject>=3.42.0",
]

[project.urls]
Homepage = "https://github.com/macina222/gnome-icon-pack-creator"
Repository = "https://github.com/macina222/gnome-icon-pack-creator"
Issues = "https://github.com/macina222/gnome-icon-pack-creator/issues"

[project.scripts]
gipc = "src.ui.main_window:main"

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.locales" = ["*.json"]